# Repository-wide Cargo defaults for the development build standard.
#
# The pinned `mold` linker and the parallel `rustc` frontend are the defaults
# for every development, test, lint, docs and typecheck build. Cargo
# auto-discovers this file, so a bare `cargo build` gets them too; there is no
# opt-in path and no slower alternative to choose.
#
# Release builds are excluded by assigning `RUSTFLAGS` in the Makefile, which
# displaces every `rustflags` table below; see "Development build standard" in
# docs/developers-guide.md for the mechanism and the contracts.
#
# No codegen backend is named here, for any profile, and a contract refuses
# one. The standard is the linker and the frontend only.

# Cargo selects a single `rustflags` source rather than merging them: a
# matching `[target.*]` table replaces `[build] rustflags` outright, and an
# externally set `RUSTFLAGS` replaces both. Every flag that must survive is
# therefore repeated in each source, including the `RUSTFLAGS` the Makefile
# composes for its gate targets. The workflow contracts hold the sources
# equal.
[build]
rustflags = ["-Zthreads=8"]

# `mold` ships for Linux only, so the linker flag is gated behind a target
# `cfg`. macOS and Windows fall through to `[build] rustflags` above and use
# their platform default linker. `-Zthreads=8` is repeated rather than
# inherited because a matching target table replaces the build table.
[target.'cfg(target_os = "linux")']
rustflags = ["-Zthreads=8", "-Clink-arg=-fuse-ld=mold"]
