name: Netsuke v0.1.0 release-admission canary

on:
  push:
    branches: [issue-598-v010-netsuke-canary]
  workflow_dispatch:

jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: leynos/shared-actions/.github/actions/setup-rust@f4764bea8d813b1a8f7ebc37a44907d3c3b1e0e4
      - name: Install Whitaker
        run: |
          set -euo pipefail
          cargo install --locked whitaker-installer --version 0.2.6
          whitaker-installer
      - name: Install the pinned Netsuke candidate
        id: netsuke
        uses: leynos/netsuke/.github/actions/install-release-candidate@ba0f87cd9e518ed81a5eb32709d8f2a65dae4124
        with:
          revision: ba0f87cd9e518ed81a5eb32709d8f2a65dae4124
          expected-version: 0.1.0-beta2
      - name: Run the serial aggregate action
        shell: bash
        run: |
          set +e
          "${{ steps.netsuke.outputs.binary }}" build all
          status=$?
          printf '{"repository":"leynos/repovec-appliance","downstream_revision":"%s","netsuke_revision":"%s","netsuke_version":"%s","target":"all","platform":"%s","status":%s}\n' \
            "$GITHUB_SHA" "${{ steps.netsuke.outputs.revision }}" "${{ steps.netsuke.outputs.version }}" "$RUNNER_OS" "$status"
          exit "$status"
