[package]
name = "repovecd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes crate-private traversal seams to integration tests. It adds no
# production behaviour, and is enabled only by this crate's dev-dependencies.
test-support = []

[dependencies]
camino.workspace = true
cap-std.workspace = true
monotony.workspace = true
nom-rfc8288.workspace = true
oauth2 = { workspace = true, features = ["reqwest-blocking", "rustls-tls"] }
repovec-core = { path = "../repovec-core" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Enable the crate's own test seam for its test targets only.
repovecd = { path = ".", features = ["test-support"] }
googletest.workspace = true
insta.workspace = true
monotony = { workspace = true, features = ["test-util"] }
oauth2-test-server.workspace = true
pretty_assertions.workspace = true
proptest.workspace = true
repovec-test-helpers = { path = "../repovec-test-helpers", features = ["snapshots"] }
rstest.workspace = true
rstest-bdd.workspace = true
rstest-bdd-macros = { workspace = true, features = ["strict-compile-time-validation"] }
tokio.workspace = true
trybuild.workspace = true

[lints]
workspace = true
