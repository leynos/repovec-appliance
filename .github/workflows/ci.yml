name: CI

'on':
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Every job below runs on `ubicloud-standard-2`, except on a pull request
  # from a fork, which cannot obtain an Ubicloud runner and falls back to a
  # GitHub-hosted one. The shape is written once here rather than explained
  # seven times.
  #
  # The continuation line sits at the SAME indent as the line above it. A
  # more-indented continuation in a folded scalar keeps its line break, which
  # puts a newline inside the expression; GitHub evaluates the broken value
  # regardless, so a green run is not evidence that the scalar is well
  # formed. `ci_runner_placement_test.py` reads the parsed value and fails on
  # an embedded line break.
  #
  # `timeout-minutes` is per job, sized from measured runs at a generous
  # multiple and recorded with its evidence in docs/developers-guide.md. A
  # per-minute runner bills until something stops it, so the six-hour default
  # is the expensive failure mode; a ceiling near the work is the other one,
  # because it cancels at the moment the overrun becomes interesting and
  # discards the log that would explain it.
  #
  # The Ubicloud label is registered for actionlint in .github/actionlint.yaml.
  spelling:
    name: spelling
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
          enable-cache: false
      - name: Check spelling
        run: make spelling

  build:
    name: build
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Build
        run: make build

  check-fmt:
    name: check-fmt
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@d26e53630893c942af44eb3db7efd4fcbe0c8093
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

  lint:
    name: lint
    # Right-sized on measurement, not by default. `lint` is the critical
    # path: 613 s on `ubicloud-standard-2` against 76 s to 325 s for every
    # other job. Its time is work sccache cannot avoid (linking, and the
    # analysis passes of Clippy, `cargo doc` and the Whitaker dylint
    # suite), so it scales with cores rather than with cache. Four vCPU
    # costs twice per minute, which is roughly cost-neutral if the work
    # halves, and buys back the wall-clock time.
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-4' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Install Whitaker
        uses: leynos/shared-actions/.github/actions/install-whitaker@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Lint
        run: make lint
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Install mdtablefix for workflow contracts
        # The selection contract exercises the real formatter in a scratch Git
        # repository; tool probes cover the other Make invocation boundaries.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@d26e53630893c942af44eb3db7efd4fcbe0c8093
        with:
          version: "0.6.1"
      - name: Setup Node for Markdown contracts
        id: setup_markdownlint
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Provision pinned Markdown linter for contracts
        id: provision_markdownlint
        shell: bash
        env:
          MARKDOWNLINT_ACTION_REVISION: 21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
          MARKDOWNLINT_PACKAGE_SHA256: c5d29548af9601591933259daac76c09b85d8c6788654c5651a94a26c22b33b7
          MARKDOWNLINT_LOCK_SHA256: 9951527515b50ea7aa3d574272bfc8cd2490e1668d99c3316731329f81154a2b
          MARKDOWNLINT_CLI_VERSION: '0.23.2'
          MARKDOWNLINT_CLI_INTEGRITY: sha512-eUhcnkSpzURo/o4htSqc7LPDszgOOTknhU4eY/sPHvMCLxnTCYscv1gw1/js/idmaZPisv9ECVEIORcllqjTUw==
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/repovec-markdownlint"
          mkdir -p "$tool_dir"
          release="https://raw.githubusercontent.com/DavidAnson/markdownlint-cli2-action/$MARKDOWNLINT_ACTION_REVISION"
          curl --fail --location --proto '=https' --tlsv1.2 "$release/package.json" --output "$tool_dir/package.json"
          curl --fail --location --proto '=https' --tlsv1.2 "$release/package-lock.json" --output "$tool_dir/package-lock.json"
          printf '%s  %s\n' "$MARKDOWNLINT_PACKAGE_SHA256" "$tool_dir/package.json" | sha256sum --check --strict
          printf '%s  %s\n' "$MARKDOWNLINT_LOCK_SHA256" "$tool_dir/package-lock.json" | sha256sum --check --strict
          npm ci --prefix "$tool_dir" --omit=dev --ignore-scripts --no-audit --no-fund
          node --input-type=module - "$tool_dir" <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const root = process.argv[2];
          const cli = JSON.parse(readFileSync(`${root}/node_modules/markdownlint-cli2/package.json`, 'utf8'));
          const lock = JSON.parse(readFileSync(`${root}/package-lock.json`, 'utf8'));
          assert.equal(cli.version, process.env.MARKDOWNLINT_CLI_VERSION);
          assert.equal(lock.packages['node_modules/markdownlint-cli2'].integrity, process.env.MARKDOWNLINT_CLI_INTEGRITY);
          JS
      - name: Workflow contract tests
        id: workflow_contracts
        env:
          MDLINT: ${{ runner.temp }}/repovec-markdownlint/node_modules/.bin/markdownlint-cli2
        run: make test-workflow-contracts

  test:
    name: test
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.13'
          enable-cache: true
      - name: Test
        run: make test

  docs-gate:
    name: docs-gate
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Build docs-gate helper
        shell: bash
        run: |
          set -euo pipefail
          cargo build --quiet -p repovec-ci
      - name: Decide whether documentation gates should run
        id: docs_gate_plan
        shell: bash
        run: |
          set -euo pipefail

          base_ref=""
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            base_ref="${{ github.event.before }}"
          fi

          if [[ -n "${base_ref}" && "${base_ref}" != "0000000000000000000000000000000000000000" ]]; then
            mapfile -t changed_files < <(git diff --name-only "${base_ref}" "${GITHUB_SHA}")
          else
            changed_files=()
          fi

          if [[ "${#changed_files[@]}" -gt 0 ]]; then
            printf '%s\n' "${changed_files[@]}" | target/debug/repovec-ci --stdin >>"${GITHUB_OUTPUT}"
          else
            target/debug/repovec-ci >>"${GITHUB_OUTPUT}"
          fi
      - name: Report documentation gate decision
        shell: bash
        run: |
          set -euo pipefail
          echo "should_run=${{ steps.docs_gate_plan.outputs.should_run }}"
          echo "docs_gate_required=${{ steps.docs_gate_plan.outputs.docs_gate_required }}"
          echo "nixie_required=${{ steps.docs_gate_plan.outputs.nixie_required }}"
          echo "reason=${{ steps.docs_gate_plan.outputs.reason }}"
          echo "matched_files_count=${{ steps.docs_gate_plan.outputs.matched_files_count }}"
          echo "matched_files=${{ steps.docs_gate_plan.outputs.matched_files }}"
          echo "conservative_fallback_files_count=${{ steps.docs_gate_plan.outputs.conservative_fallback_files_count }}"
          echo "conservative_fallback_files=${{ steps.docs_gate_plan.outputs.conservative_fallback_files }}"
      - name: Setup uv for documentation gates
        if: >-
          steps.docs_gate_plan.outputs.docs_gate_required == 'true' ||
          steps.docs_gate_plan.outputs.nixie_required == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          python-version: '3.14'
      - name: Markdown lint
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        if: steps.docs_gate_plan.outputs.docs_gate_required == 'true'
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'
      - name: Install Mermaid validation tools
        if: steps.docs_gate_plan.outputs.nixie_required == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv tool install nixie-cli==1.1.0
          cargo install merman-cli --version 0.7.0 --locked
      - name: Mermaid validation
        if: steps.docs_gate_plan.outputs.nixie_required == 'true'
        run: make nixie
      - name: Skip documentation gates
        if: steps.docs_gate_plan.outputs.docs_gate_required != 'true'
        run: echo "No documentation inputs detected; documentation gates skipped."

  systemd-gate:
    name: systemd-gate
    runs-on: >-
      ${{ github.event.pull_request.head.repo.fork
      && 'ubuntu-latest' || 'ubicloud-standard-2' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@d26e53630893c942af44eb3db7efd4fcbe0c8093
      - name: Validate checked-in systemd units
        run: make validate-systemd
