# Repository-specific formal names.

schema = 1

[oxford]
stems = []

[words]
# Official name: the ratatui Rust crate.
accepted = ["ratatui"]

[words.corrections]

[patterns]
ignore = [
  # "mold" names the linker (https://github.com/rui314/mold) in these
  # contexts only; the mould correction stays active elsewhere.
  "-fuse-ld=mold",
  "mold linker",
  "Cranelift \\+ mold",
  "Cranelift and mold",
  "`mold`",
  # Official documentation and product names across line wrapping.
  'Azure Architecture\s+Center\s+\|\s+Microsoft Learn',
  'GitHub\s+Flavored\s+Markdown',
]

[files]
exclude = []
