# Nextest configuration shared by the test lanes.
#
# The coverage action supplies these profile defaults, but only when no nextest
# configuration exists: `ensure_nextest_config` writes a temporary file when the
# resolved path is absent, and leaves an existing file alone. Because this file
# exists, the defaults it would have supplied are restated here, so the coverage
# lane keeps its 180 s termination policy and a ceiling on the run (20 minutes
# here, since the warm-up scripts below run inside it) instead of falling back
# to nextest's 60 s period with no global timeout.
#
# Setup scripts are experimental in the nextest versions the coverage action may
# install, so the configuration opts in; newer versions accept the entry.
experimental = ["setup-scripts"]

[profile.default]
slow-timeout = { period = "180s", terminate-after = 1, grace-period = "5s" }
# The whole run, setup scripts included (a script still running when it expires
# is terminated). It sits above the three warm-up allowances below (1,020 s in
# all) and below the 25-minute `test` and `coverage` jobs, so nextest reports an
# overrun itself and the job is not cancelled without a log.
global-timeout = "20m"

# The `compile_time` binaries drive `trybuild`, which compiles each UI fixture
# as its own crate in a generated project and therefore rebuilds the package and
# its dependencies once per project. Under `cargo llvm-cov` every one of those
# compilation units is instrumented, so the profile's budget expires while the
# fixtures are still compiling; nextest then reports a timeout rather than the
# assertion the test exists to make (observed on PR #216, run 41348216522: 627
# passed, 1 timed out at 180 s).
#
# Each driver keeps its own exact-name override rather than a broad binary
# filter, so the longer budget cannot silently cover an unrelated test. The
# tests assert compile failures and contribute no coverage, so they keep a
# longer budget instead of being skipped: skipping would stop measuring the
# contracts that guard the opaque types.
[[profile.default.overrides]]
filter = 'test(=opaque_secrets_and_observer_bounds_fail_to_compile)'
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'test(=installation_token_field_and_accessor_stay_private)'
slow-timeout = { period = "120s", terminate-after = 5 }

# Tests that start a child cargo or rustc: the trybuild suite above and the
# environment-policy lint UI test. They contend for the package-cache lock and
# for build parallelism, so they run one at a time, each bounded by its own
# allowance.
[test-groups.nested-cargo-builds]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(=compile_time) | binary(=environment_policy_lint_ui)'
test-group = "nested-cargo-builds"

# Each of those tests compiles inside its own timed body: trybuild builds every
# UI fixture as a crate of its own, and the lint test runs Clippy on a fixture
# package. On a cold `target` directory, or a host whose shared compile pool is
# queueing, the first run spends its whole allowance waiting for compile slots
# and is killed with no failing assertion (#270). These scripts run each binary
# once before any test starts, under an allowance of their own, so the timed
# bodies find the generated projects built: trybuild keeps its project under
# `target/tests/trybuild/<package>` and reuses it while the flags match, and the
# scripts take the same `RUSTFLAGS` and `--all-features` as the gate.
#
# One script per binary, selected by `binary_id`, so a run that selects one of
# these tests warms only that test's build. A failing test in a warm-up makes the
# script fail, and nextest then reports that test's own output rather than
# running the tests it serves. Every command is `--frozen` (locked and offline).
# The allowances sum to 1,020 s, which `global-timeout` stays above.
#
# A new test that starts a nested build needs an entry in the override above and
# a script and rule here.
[scripts.setup.warm-core-compile-time]
command = "cargo test --frozen --all-features -p repovec-core --test compile_time"
slow-timeout = { period = "120s", terminate-after = 4 }

[scripts.setup.warm-daemon-compile-time]
command = "cargo test --frozen --all-features -p repovecd --test compile_time"
slow-timeout = { period = "120s", terminate-after = 3 }

[scripts.setup.warm-environment-policy-lint]
command = "cargo test --frozen --all-features -p repovec-ci --test environment_policy_lint_ui"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.scripts]]
filter = 'binary_id(=repovec-core::compile_time)'
setup = "warm-core-compile-time"

[[profile.default.scripts]]
filter = 'binary_id(=repovecd::compile_time)'
setup = "warm-daemon-compile-time"

[[profile.default.scripts]]
filter = 'binary_id(=repovec-ci::environment_policy_lint_ui)'
setup = "warm-environment-policy-lint"
