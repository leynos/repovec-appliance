name: Coverage (main)

# Main owns both persistent coverage outputs: the ratchet baseline and the
# CodeScene upload. Pull requests generate coverage only for their own ratchet
# check, in ci.yml; they neither publish a report nor contact CodeScene, and the
# coverage contracts under tests/workflow_contracts hold both lanes to that
# shape.
#
# The CodeScene call is what moves here, not the measurement: the shared
# uploader pins the cs-coverage archive by digest, but the tool talks to
# CodeScene's API and refuses to run when that answer changes shape. Keeping the
# call on the trunk keeps such a change off every pull request's critical path.

on:
  push:
    branches: [main]

# Never cancelled, keyed on the ref alone, and declared once at workflow scope.
# A cancelled run abandons its upload and its baseline write. GitHub treats the
# same group on a workflow and one of its jobs as a deadlock and cancels the
# job, so no job repeats it.
#
# The Dependabot automerge workflow merges with GITHUB_TOKEN, and such a merge
# fires no push event. Those changes reach this publisher only at the next
# ordinary push, so the ratchet baseline advances on push, not on merge. A
# manual "Re-run jobs" keeps its run_id and republishes that commit's coverage,
# but replaces no baseline unless the original run saved none.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    name: coverage-upload
    # Main-only: no pull request can start this workflow, so it needs no fork
    # fallback arm. This job measures and uploads on a GitHub-hosted runner,
    # with no compiler cache (a hosted runner's sccache reaches only GitHub's
    # store, which no Ubicloud lane reads). The two Ubicloud jobs below carry
    # what the Ubicloud pull-request lane reads from main.
    runs-on: ubuntu-latest
    # A cold hosted build compiles everything with no cache.
    timeout-minutes: 60
    # The CodeScene token lives in this environment, whose deployment policy
    # admits `main` alone; the environment contract holds it to this job.
    environment: codescene
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
        with:
          use-sccache: 'false'
          save-cache: 'false'
      # The coverage action runs the suite, whose Make preflight needs the
      # pinned build tools. Install them before anything compiles.
      - name: Install build standard
        run: make install-build-tools
      - name: Fetch dependencies
        # Tests start their own cargo; fetch once so none resolves cold.
        run: cargo fetch --locked
      # The selection is the baseline every pull request's ratchet is measured
      # against, so ci.yml's coverage step must match it field for field.
      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          output-path: lcov.info
          format: lcov
          with-ratchet: 'true'
          baseline-rust-file: .coverage-baseline-v2.rust
          # `coverage-baseline` saves the baseline on Ubicloud, where the
          # pull-request lane reads it.
          publish-baseline: never
          baseline-artefact-name: coverage-baseline-handover
          publish-artefact: 'false'
          language: rust
          all-targets: 'true'
          all-features: 'true'
      # Actions evaluates the expression before the shell runs, so this writes
      # `available=true` or `available=false` and binds the token nowhere. A
      # repository without the secret skips the upload rather than failing.
      - name: Check CodeScene token
        id: codescene-token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      # The uploader is a composite action that would pass a step `env` to its
      # nested steps, so the token travels only as its input. The ref check is
      # the second boundary: it keeps the upload to main even if the workflow's
      # trigger is widened.
      - name: Upload coverage data to CodeScene
        if: steps.codescene-token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          path: lcov.info
          format: lcov
          mode: upload
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}

  coverage-baseline:
    name: coverage-baseline
    # Saves the ratchet baseline the measuring job hands over, into the store
    # the Ubicloud pull-request lane reads. It does no compiling. The action
    # publishes only on a push to `main`.
    needs: coverage-upload
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Publish the ratchet baseline
        uses: leynos/shared-actions/.github/actions/publish-coverage-baseline@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          artefact-name: coverage-baseline-handover
          baseline-rust-file: .coverage-baseline-v2.rust

  coverage-warmup:
    name: coverage-warmup
    # Build-only: compiles the pull-request lane's instrumented test binaries
    # so their compiler-cache entries sit in main's Ubicloud scope, which a
    # pull request reads only if a main job on Ubicloud writes it. It runs no
    # test and uploads nothing.
    runs-on: ubicloud-standard-2
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@0eabb6bc07148981de5da395e30cd78d83f5c7c2
      - name: Install build standard
        run: make install-build-tools
      - name: Fetch dependencies
        run: cargo fetch --locked
      - name: Compile the instrumented tests
        uses: leynos/shared-actions/.github/actions/generate-coverage@f84a7def5646a6fc7ba77c1f486906f66a0fed96
        with:
          output-path: lcov.info
          format: lcov
          baseline-rust-file: .coverage-baseline-v2.rust
          language: rust
          all-targets: 'true'
          all-features: 'true'
          build-only: 'true'
